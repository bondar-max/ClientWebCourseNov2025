<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <script defer src="./node_modules/jquery/dist/jquery.min.js"></script>
    <script defer src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h1>Todo List</h1>

    <form class="new-todo-item-form row mb-3">
        <div class="col">
            <label for="new-todo-item-text-field" class="form-label visually-hidden">Новая заметка</label>
            <input id="new-todo-item-text-field" class="new-text-field form-control" type="text" placeholder="Введите заметку">
            <div class="invalid-feedback">Необходимо заполнить поле</div>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Добавить</button>
        </div>

    </form>

    <ul class="list-unstyled" id="todo-list"></ul>
</div>
</body>
</html>
