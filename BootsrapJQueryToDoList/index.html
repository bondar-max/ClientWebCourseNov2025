<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <script defer src="./node_modules/jquery/dist/jquery.min.js"></script>
    <script defer src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
    <h1>Todo List</h1>

    <form class="new-todo-item-form">
        <label class="new-todo-item-label" for="new-todo-item-text-field">Введите заметку</label>
        <div class="input-wrapper">
            <input id="new-todo-item-text-field" class="new-text-field" type="text">
            <div class="error-message">Необходимо заполнить поле</div>
        </div>
        <button type="submit" class="button-group">Добавить</button>
    </form>

    <ul id="todo-list"></ul>
</div>
</body>
</html>
